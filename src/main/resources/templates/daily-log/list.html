<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>体重ログ一覧</title>
	<link rel="stylesheet" th:href="@{/css/vendor/jquery-ui-1.14.2/jquery-ui.min.css}">
	<link rel="stylesheet" th:href="@{/css/daily-log/list.css}">
	<script th:src="@{/js/vendor/jquery-4.0.0.min.js}"></script>
	<script th:src="@{/js/vendor/jquery-ui-1.14.2.min.js}"></script>
	<script th:src="@{/js/daily-log/list.js}"></script>
</head>

<body>
	<main class="page">
	<div class="page-header">
		<h1 class="page-title">体重ログ一覧</h1>
			<div class="page-actions">
				<a th:href="@{/daily-log/new}" class="page-action-button">新規登録</a>
				<button type="button" id="modalOpen" class="page-action-button">検索条件</button>
			</div>
	</div>
	<div id="searchConditionModal">
		<div class="modal-content">
			<form th:action="@{/daily-log/search}" method="get">
				<div class="search-condition-row">
					<span class="condition-label">計測日</span>
					<label>
						From
						<input type="date" name="startDate" th:value="${startDate}" required>
					</label>

					<label>
						To
						<input type="date" name="endDate" th:value="${endDate}" required>
					</label>
				</div>
				<div class="search-condition-row">
					<span class="condition-label">体重</span>

					<label>
						From
						<input type="number" name="minWeightKg" step="0.1" th:value="${minWeightKg}">
					</label>

					<label>
						To
						<input type="number" name="maxWeightKg" step="0.1" th:value="${maxWeightKg}">
					</label>
				</div>
				<div class="search-condition-actions">
					<button type="submit" class="modal-action-button">検索</button>
					<button type="button" id="modalClose" class="modal-action-button">閉じる</button>
				</div>

			</form>
		</div>
	</div>
	<div class="table-scroll">
		<table class="log-table">
			<thead>
				<tr>
					<th class="edit-column">編集</th>
					<th class="delete-column">削除</th>
					<th class="date-column">日付</th>
					<th class="weight-column">体重</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="dailyLog : ${dailyLogs}">
					<td class="edit-column"><a th:href="@{/daily-log/{logDate}/edit(logDate=${dailyLog.logDate})}" class="table-action-button">編集</a></td>
					<td class="delete-column">
						<form th:action="@{/daily-log/{logDate}/delete(logDate=${dailyLog.logDate})}" method="post">
							<button type="submit" class="table-action-button" onclick="return confirm('削除しますか？')">削除</button>
						</form>
					</td>
					<td class="date-column" th:text="${dailyLog.logDate}"></td>
					<td class="weight-column" th:text="${dailyLog.weightKg}"></td>
				</tr>
			</tbody>
		</table>
	</div>
	</main>
</body>

</html>
