<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>体重ログ一覧</title>
	<link rel="stylesheet" th:href="@{/css/vendor/jquery-ui-1.14.2/jquery-ui.min.css}">
	<link rel="stylesheet" th:href="@{/css/daily-log/list.css}">
	<script th:src="@{/js/vendor/jquery-4.0.0.min.js}"></script>
	<script th:src="@{/js/vendor/jquery-ui-1.14.2.min.js}"></script>
	<script th:src="@{/js/daily-log/list.js}"></script>
</head>

<body>
	<h1>体重ログ一覧</h1>
	<a th:href="@{/daily-log/new}">新規登録</a>
	<button type="button" id="modalOpen">検索条件</button>
	<div id="searchConditionModal">
		<div class="modal-content">
			<form th:action="@{/daily-log/search}" method="get">
				<div class="search-condition-row">
					<span class="condition-label">計測日</span>
					<label>
						From
						<input type="date" name="startDate" th:value="${startDate}" required>
					</label>

					<label>
						To
						<input type="date" name="endDate" th:value="${endDate}" required>
					</label>
				</div>
				<div class="search-condition-row">
					<span class="condition-label">体重</span>

					<label>
						From
						<input type="number" name="minWeightKg" step="0.1" th:value="${minWeightKg}">
					</label>

					<label>
						To
						<input type="number" name="maxWeightKg" step="0.1" th:value="${maxWeightKg}">
					</label>
				</div>
				<div class="search-condition-actions">
					<button type="submit">検索</button>
					<button type="button" id="modalClose">閉じる</button>

				</div>

			</form>
		</div>
	</div>
	<table>
		<thead>
			<tr>
				<th>日付</th>
				<th>体重</th>
				<th>編集</th>
				<th>削除</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="dailyLog : ${dailyLogs}">
				<td th:text="${dailyLog.logDate}"></td>
				<td th:text="${dailyLog.weightKg}"></td>
				<td><a th:href="@{/daily-log/{logDate}/edit(logDate=${dailyLog.logDate})}">編集</a></td>
				<td>
					<form th:action="@{/daily-log/{logDate}/delete(logDate=${dailyLog.logDate})}" method="post">
						<button type="submit" onclick="return confirm('削除しますか？')">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
